spring.datasource.url=jdbc:h2:file:./backend/data/aether-ai;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
app.billing.test-mode-enabled=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.refresh-cookie-secure=false
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
