spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aether_ai}
spring.datasource.username=${DB_USERNAME:aether_ai}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration,classpath:db/postgresql-migration

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.auth.refresh-cookie-secure=true
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rag.enabled=${RAG_ENABLED:false}
