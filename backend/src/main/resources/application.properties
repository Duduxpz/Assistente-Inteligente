spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.application.name=aether-ai-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aether_ai}
spring.datasource.username=${DB_USERNAME:aether_ai}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=AETHER AI
info.app.description=Assistente inteligente para conversas, tarefas e documentos

logging.structured.format.console=logstash
server.shutdown=graceful

security.jwt.secret=${JWT_SECRET:}
security.jwt.ttl=${JWT_TTL:PT15M}
app.documents.storage-path=${DOCUMENTS_STORAGE_PATH:./backend/data/documents}
ai.provider=${AI_PROVIDER:none}
ai.openrouter.api-key=${OPENROUTER_API_KEY:}
ai.openrouter.model=${OPENROUTER_MODEL:openai/gpt-4o-mini}
ai.openrouter.site-url=${OPENROUTER_SITE_URL:http://localhost:5173}
ai.models.free=${AI_MODEL_FREE:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
ai.models.plus=${AI_MODEL_PLUS:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
ai.models.ultra=${AI_MODEL_ULTRA:${OPENROUTER_MODEL:openai/gpt-4o-mini}}
app.email.provider=${EMAIL_PROVIDER:none}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from=${RESEND_FROM:}
app.email.resend.frontend-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
app.mercadopago.webhook-secret=${MERCADOPAGO_WEBHOOK_SECRET:}
app.mercadopago.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:5173}
app.billing.test-mode-enabled=false
app.billing.test-ultra-email=${AETHER_TEST_ULTRA_EMAIL:}
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:false}
app.rate-limit.window=${RATE_LIMIT_WINDOW:PT1M}
app.rate-limit.login.max-requests=${RATE_LIMIT_LOGIN_MAX:10}
app.rate-limit.register.max-requests=${RATE_LIMIT_REGISTER_MAX:5}
app.rate-limit.password-reset.max-requests=${RATE_LIMIT_PASSWORD_RESET_MAX:5}
app.rate-limit.chat.max-requests=${RATE_LIMIT_CHAT_MAX:30}
app.auth.refresh-token-ttl=${REFRESH_TOKEN_TTL:P30D}
app.auth.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}
app.rag.enabled=${RAG_ENABLED:false}
app.rag.embedding.base-url=${RAG_EMBEDDING_BASE_URL:}
app.rag.embedding.api-key=${RAG_EMBEDDING_API_KEY:}
app.rag.embedding.model=${RAG_EMBEDDING_MODEL:}
app.rag.embedding.dimensions=${RAG_EMBEDDING_DIMENSIONS:1536}
app.rag.chunk-size=${RAG_CHUNK_SIZE:1200}
app.rag.chunk-overlap=${RAG_CHUNK_OVERLAP:200}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
